<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suplementos Inteligentes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-background: #ffffff;
        --color-surface: #f8fafc;
        --color-primary: #0f172a;
        --color-secondary: #64748b;
        --color-accent: #4f46e5;
        --color-border: #e2e8f0;
      }
      .dark {
        --color-background: #0a0a0a;
        --color-surface: #121212;
        --color-primary: #e5e5e5;
        --color-secondary: #a3a3a3;
        --color-accent: #6366f1;
        --color-border: #262626;
      }
      body {
        background-color: var(--color-background);
        color: var(--color-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.3s, color 0.3s;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-background);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-secondary);
      }

      /* AI Content Highlighting */
      .prose-amber strong {
        color: #f59e0b; /* Amber 500 */
        font-weight: 900;
        text-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
      }
      .prose-amber em {
        color: #fbbf24; /* Amber 400 */
        font-style: italic;
        background: rgba(245, 158, 11, 0.05);
        padding: 0 4px;
        border-radius: 4px;
      }
      .prose-amber h1, .prose-amber h2, .prose-amber h3 {
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: -0.05em;
        font-style: italic;
        font-weight: 900;
      }
      .prose-amber table {
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        overflow: hidden;
      }
      .prose-amber th {
        background: rgba(245, 158, 11, 0.1);
        color: #f59e0b;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              background: 'var(--color-background)',
              surface: 'var(--color-surface)',
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              border: 'var(--color-border)',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.6s ease-out forwards',
              'float-crown': 'floatCrown 3s ease-in-out infinite',
              'shimmer': 'shimmer 2s linear infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              floatCrown: {
                '0%, 100%': { transform: 'translateY(0) rotate(5deg)' },
                '50%': { transform: 'translateY(-4px) rotate(-5deg)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "jspdf": "https://esm.sh/jspdf@^2.5.1",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
